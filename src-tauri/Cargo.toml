[package]
name = "carrier"
version = "1.10.1"
description = "A tiny, distraction-free desktop client for Facebook Messenger"
authors = ["kristofferR"]
edition = "2021"
# Keep in step with the highest dependency MSRV (Tauri 2 + plugins) so the
# advertised minimum is actually buildable.
rust-version = "1.89"

[lib]
# The Tauri app logic lives in a lib so it can be shared with mobile targets.
name = "carrier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Dev-only AI/DOM inspection over a local socket. Enable with `--features mcp`
# (e.g. `cargo tauri dev --features mcp`); never enabled for release builds.
mcp = ["dep:tauri-plugin-mcp"]

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
# The `log` macros behind tauri-plugin-log; failures that used to vanish into
# `let _ =` / eprintln! go through these so release builds capture them.
log = "0.4"
# Global summon hotkey (Settings → Global Hotkey): show/hide Carrier from
# anywhere. Registered purely from Rust, so it needs no capability entry.
tauri-plugin-global-shortcut = "2"
# New-message notifications are built natively (not via the notification plugin)
# so the sender's avatar survives: the plugin drops images on desktop, whereas
# notify-rust attaches them (a thumbnail on macOS, the icon on Linux/Windows).
# notify-rust is already in the tree via tauri-plugin-notification, so it adds no
# build cost. `base64` decodes the avatar the page hands us as a PNG data URL.
notify-rust = "4"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
open = "5"
# Already in the tree via Tauri; the short delay when recreating a window on a
# theme switch (the macOS title bar can only be re-themed at window creation).
tokio = { version = "1", features = ["sync", "time"] }
# Dev-only (the `mcp` feature): webview inspection over a local socket.
# Pinned to a rev: an unpinned git dep is a supply-chain/reproducibility snag.
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp", rev = "c7d271a06469bdf4744bfdeadca7458a1f3d02e5", optional = true }

# `ToSocketAddrs` collapses Unix getaddrinfo statuses into an uncategorized
# I/O error. Preserve EAI_AGAIN so startup retries remain narrowly transient.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# System-theme detection outside Linux. On Linux it duplicates the portal work
# linux.rs already handles, so keeping it non-Linux avoids compiling a second
# settings backend.
[target.'cfg(not(target_os = "linux"))'.dependencies]
dark-light = "3"
# Keep Tauri's native tray path on macOS and Windows; Linux uses KSNI below.
tauri = { version = "2", features = ["tray-icon"] }

# Linux system-theme observation and detection, straight from the
# `org.freedesktop.appearance` settings portal (see linux.rs). `async-io`
# supplies the `block_on` for the synchronous point-in-time read.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts", "settings"] }
async-io = "2"
futures-util = "0.3"
# Apply the GlobalShortcuts portal activation token to GTK's native window
# before revealing it, so Wayland compositors permit the focus transfer.
gtk = "0.18"
# Configure the WebKitGTK instance Tauri already embeds without adding another
# WebKit build. Keep normal document caching, but use the smaller browser cache
# model and opt out of the in-memory back/forward page cache.
webkit2gtk = "2.0.2"
# Tauri's AppIndicator tray backend cannot emit click events or expose a real
# tooltip on Linux. KSNI implements the StatusNotifierItem protocol directly.
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
# KDE targets its non-standard NotificationReplied signal to the exact D-Bus
# connection that sent Notify. Keep that connection so Linux inline replies can
# be received and routed back to Messenger.
zbus = "5"

# macOS only: Tauri doesn't disable the WKWebView's opaque white background on
# macOS (the webview layer is unimplemented there), so the theme-coloured window
# background never shows through. Flip `drawsBackground` off ourselves via KVC.
# Same versions Tauri already pulls in, so no extra build cost.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSValue", "NSObject", "NSDictionary", "NSArray", "NSSet", "NSURL", "NSError"] }
# Modern notifications on macOS 26/27: the legacy NSUserNotification path
# (mac-notification-sys / notify-rust) is deprecated and no longer presents
# banners for third-party apps — the app never even registers in System
# Settings. We deliver via UNUserNotificationCenter instead (the same move
# Electron made in v42): build a UNMutableNotificationContent (+ avatar
# attachment), add the request, and route presentation/click through a
# UNUserNotificationCenterDelegate.
objc2-user-notifications = { version = "0.3.2", features = ["UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationAttachment", "UNNotificationSound", "UNNotificationAction", "UNNotificationCategory", "UNNotificationResponse", "UNNotification", "UNNotificationTrigger", "NSString_UserNotifications", "block2"] }
# Still pulled in transitively via notify-rust (which Linux/Windows use), so it
# adds no build cost; the macOS notification code no longer references it.
mac-notification-sys = "0.6"
# The Dock menu (recent conversations): Tauri exposes no Dock-menu API, so the
# NSMenu is built with muda directly (the same crate Tauri's menus wrap — same
# version, no extra build cost) and served via an `applicationDockMenu:` hook.
# Menu events still flow through Tauri's regular menu-event plumbing.
muda = "0.19"

[target.'cfg(target_os = "windows")'.dependencies]
# Win32_System_Registry: read the taskbar's light/dark preference for the
# monochrome tray tint (SystemUsesLightTheme, which the dark-light crate does
# NOT read — it reads AppsUseLightTheme, and the two diverge under Win11 Custom).
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry"] }
# Register the carrier:// URL scheme in HKCU (per-user, no admin) so protocol
# launches reach Carrier as argv and are parsed in one audited place by
# actions::action_from_argv. Registration only — the plugin's JS API capability
# and single-instance's deep-link feature are intentionally left off.
tauri-plugin-deep-link = "2"
# Raw WinRT for the toast module (text input, toast tag/group, Action Center
# history removal — none of which notify-rust's backend exposes). Already in the
# tree transitively via tauri-winrt-notification, so it adds no new build cost.
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    # Taskbar jump list (ICustomDestinationList + IShellLinkW + IPropertyStore).
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
