name: Linux store packages

# Candidate artifacts only. Store publication is a separate reviewed step.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - snap/**
      - packaging/**
      - src-tauri/Cargo.lock
      - .github/workflows/linux-stores.yml

permissions:
  contents: read

jobs:
  snap:
    name: Snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        id: snapcraft
      - name: Verify notification desktop identity
        env:
          SNAP_PACKAGE: ${{ steps.snapcraft.outputs.snap }}
        run: |
          if ! command -v unsquashfs >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y squashfs-tools
          fi
          # GNOME needs the normal launcher for window/badge matching and a
          # hidden, preserved snap.carrier identity for exported portal actions.
          unsquashfs -cat "$SNAP_PACKAGE" meta/gui/carrier.desktop > /dev/null
          unsquashfs -cat "$SNAP_PACKAGE" meta/gui/snap.carrier.desktop | grep -qx 'NoDisplay=true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: carrier-snap-${{ matrix.arch }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
