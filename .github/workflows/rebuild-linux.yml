name: Rebuild Linux 3.2.0

# One-off: rebuild v3.2.0's Linux bundles on Ubuntu 22.04 so they run on
# glibc 2.35 systems. The signed bundles are uploaded as workflow artifacts
# and swapped into the release by hand after inspection. A commit whose
# message contains [aur] instead refreshes the AUR package from the swapped
# release assets.
on:
  push:
    branches: [ci/rebuild-linux-3.2.0]

permissions:
  contents: read

env:
  VERSION: "3.2.0"

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[aur]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev \
            libunwind-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            build-essential \
            minisign firejail xvfb xdotool imagemagick
          dpkg-query -W libc6 libwebkit2gtk-4.1-0 libgstreamer1.0-0 libgtk-3-0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Add the release notes to the Linux metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/release/metainfo.ts "$VERSION"
          python3 -c 'import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' \
            src-tauri/linux/app.chatpane.Chatpane.metainfo.xml

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARGET: ${{ matrix.target }}
        run: bun run tauri build --target "$TARGET" --config src-tauri/tauri.conf.release.json

      - name: Collect bundles with release names
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          mkdir -p out report
          for ext in AppImage deb rpm; do
            src=$(find "$bundle" -maxdepth 2 -type f -name "*.$ext" | head -n1)
            if [ -z "$src" ] || [ ! -s "$src.sig" ]; then
              echo "::error::Missing the .$ext bundle or its updater signature."
              exit 1
            fi
            cp "$src" "out/Chatpane_${VERSION}_lin_${ARCH}.$ext"
            cp "$src.sig" "out/Chatpane_${VERSION}_lin_${ARCH}.$ext.sig"
          done
          ls -l out

      - name: Verify updater signatures
        run: |
          set -euo pipefail
          jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json | base64 -d > updater.pub
          for f in out/*.AppImage out/*.deb out/*.rpm; do
            base64 -d "$f.sig" > "$RUNNER_TEMP/bundle.minisig"
            minisign -V -p updater.pub -m "$f" -x "$RUNNER_TEMP/bundle.minisig"
          done

      - name: Check the glibc floor
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          app="$PWD/out/Chatpane_${VERSION}_lin_${ARCH}.AppImage"
          chmod +x "$app"
          mkdir -p "$RUNNER_TEMP/appimage" "$RUNNER_TEMP/deb"
          (cd "$RUNNER_TEMP/appimage" && "$app" --appimage-extract >/dev/null)
          dpkg-deb -x "out/Chatpane_${VERSION}_lin_${ARCH}.deb" "$RUNNER_TEMP/deb"
          find "$RUNNER_TEMP/appimage/squashfs-root" -path '*gstreamer-1.0*' -name '*.so' -printf '%f\n' \
            | sort > "report/gst-plugins-${ARCH}.txt"
          for root in "$RUNNER_TEMP/appimage/squashfs-root" "$RUNNER_TEMP/deb"; do
            floor=$(find "$root" -type f -print0 | xargs -0 -r readelf -V --wide 2>/dev/null \
              | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | tail -n1)
            echo "$(basename "$root") needs ${floor:-no glibc}"
            if [ -z "$floor" ] || [ "${floor#GLIBC_2.}" -gt 35 ]; then
              echo "::error::$(basename "$root") needs ${floor:-nothing}; Ubuntu 22.04 has glibc 2.35."
              exit 1
            fi
          done

      # Mirrors the AppImage catalog test: no network, Xvfb, firejail, and a
      # visible window within 30 seconds.
      - name: Start offline like the AppImage catalog test
        continue-on-error: true
        env:
          ARCH: ${{ matrix.arch }}
          DISPLAY: ":99"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          set -u
          Xvfb :99 -screen 0 800x600x24 >/dev/null 2>&1 &
          sleep 2
          firejail --quiet --noprofile --net=none --appimage \
            "out/Chatpane_${VERSION}_lin_${ARCH}.AppImage" > "report/start-${ARCH}.log" 2>&1 &
          pid=$!
          sleep 10
          shown=false
          for _ in $(seq 1 20); do
            kill -0 "$pid" 2>/dev/null || break
            if timeout 5 xdotool search --onlyvisible --name '.' >/dev/null 2>&1; then
              shown=true
              break
            fi
            sleep 1
          done
          sleep 3
          import -window root "report/start-${ARCH}.png" || true
          kill -0 "$pid" 2>/dev/null && running=true || running=false
          kill "$pid" 2>/dev/null || true
          sleep 2
          head -c 20000 "report/start-${ARCH}.log"
          echo "window shown: $shown, still running: $running"
          [ "$shown" = true ] && [ "$running" = true ]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            out/
            report/
          if-no-files-found: error

  aur:
    if: ${{ contains(github.event.head_commit.message, '[aur]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate PKGBUILD from template
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/aur
          gh release download "v$VERSION" --pattern "Chatpane_${VERSION}_lin_x64.deb" --dir /tmp/aur
          gh release download "v$VERSION" --pattern "Chatpane_${VERSION}_lin_arm.deb" --dir /tmp/aur
          SHA_X64=$(sha256sum "/tmp/aur/Chatpane_${VERSION}_lin_x64.deb" | cut -d' ' -f1)
          SHA_ARM=$(sha256sum "/tmp/aur/Chatpane_${VERSION}_lin_arm.deb" | cut -d' ' -f1)
          SHA_LICENSE=$(sha256sum LICENSE | cut -d' ' -f1)
          mkdir -p aur
          sed -e "s/@PKGVER@/${VERSION}/" \
              -e "s/@SHA_LICENSE@/${SHA_LICENSE}/" \
              -e "s/@SHA_X64@/${SHA_X64}/" \
              -e "s/@SHA_ARM@/${SHA_ARM}/" \
              packaging/aur/PKGBUILD.tpl > aur/PKGBUILD
          grep -E '^sha256sums' aur/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: chatpane
          pkgbuild: ./aur/PKGBUILD
          commit_username: kristofferR
          commit_email: 481270+kristofferR@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Rebuild the 3.2.0 packages on Ubuntu 22.04 for older glibc"
