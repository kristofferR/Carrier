<!doctype html>
<html lang="en" data-window="settings">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrier Settings</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #ffffff; color: #1c1e21;
        display: flex; flex-direction: column;
        -webkit-user-select: none; user-select: none;
      }
      /* Tab strip pinned to the top — stacked icon + label, like IPTVChecker.
         `main` is the only scroll container (flex:1 + overflow), so the strip
         already stays put; `flex:0 0 auto` (never shrink) plus a sticky, opaque
         background make that pinning explicit and robust to layout changes. */
      .tabs {
        position: sticky; top: 0; z-index: 1; flex: 0 0 auto;
        display: flex; gap: 6px; justify-content: center;
        padding: 12px 12px 10px;
        background: #ffffff; border-bottom: 1px solid #e4e6eb;
      }
      .tab {
        flex: 1 1 0; min-width: 0;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        padding: 9px 4px; border-radius: 10px;
        background: transparent; border: 0; cursor: pointer;
        color: #65676b; font: inherit; font-size: 11px; font-weight: 500;
      }
      .tab .lbl { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tab svg { width: 22px; height: 22px; }
      .tab:hover { background: #f0f2f5; color: #1c1e21; }
      .tab.active { background: #e7f0ff; color: #0866ff; }
      .tab.active svg { stroke-width: 1.9; }
      main { flex: 1; overflow-y: auto; padding: 6px 10px; }
      .row {
        display: flex; align-items: flex-start; gap: 12px;
        padding: 12px; border-radius: 8px; cursor: pointer;
      }
      .row:hover { background: #f0f2f5; }
      .row input { margin-top: 2px; width: 16px; height: 16px; }
      .label { font-weight: 500; }
      .hint { color: #65676b; font-size: 12px; margin-top: 2px; }
      .nickname-options { border: 1px solid #ececee; border-radius: 8px; background: #fafafa; }
      .nickname-heading { padding: 12px 12px 0; }
      /* Appearance: theme gallery, accent, font, app icon. */
      .section-head {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 14px 12px 8px;
      }
      .section-title { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #65676b; }
      .section-control { display: flex; align-items: center; gap: 10px; font-size: 13px; }
      .seg { display: inline-flex; background: #e4e6eb; border-radius: 8px; padding: 2px; }
      .seg button {
        border: 0; background: transparent; font: inherit; font-size: 12.5px; font-weight: 500;
        color: #65676b; padding: 4px 12px; border-radius: 6px; cursor: pointer;
      }
      .seg button[aria-checked="true"] { background: #ffffff; color: #1c1e21; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
      .theme-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px; padding: 2px 12px;
      }
      .theme-card {
        display: flex; flex-direction: column; gap: 4px; min-width: 0;
        border: 0; background: transparent; padding: 0; font: inherit; color: inherit;
        text-align: left; cursor: pointer;
      }
      .theme-card .preview {
        position: relative; display: flex; aspect-ratio: 16 / 10; border-radius: 9px; overflow: hidden;
        outline: 1px solid rgba(0,0,0,.12); outline-offset: -1px;
      }
      .theme-card[aria-checked="true"] .preview { outline: 2.5px solid #0866ff; outline-offset: 2px; }
      .theme-card.unavailable .preview { opacity: .45; }
      .preview .list { width: 34%; padding: 9% 5% 0; display: flex; flex-direction: column; gap: 9%; }
      .preview .list i { display: block; height: 7%; min-height: 4px; border-radius: 3px; opacity: .22; }
      .preview .chat { flex: 1; margin: 4%; border-radius: 5px; display: flex; flex-direction: column; justify-content: flex-end; gap: 5%; padding: 6%; }
      .preview .bubble { height: 12%; min-height: 6px; border-radius: 99px; }
      .preview .bubble.in { width: 55%; }
      .preview .bubble.out { width: 45%; align-self: flex-end; }
      .preview .pill {
        position: absolute; left: 6px; bottom: 6px; font-size: 10.5px; font-weight: 600;
        background: rgba(0,0,0,.7); color: #e4e6eb; border-radius: 99px; padding: 1px 7px;
      }
      .preview .check {
        position: absolute; right: 6px; top: 6px; width: 20px; height: 20px; border-radius: 50%;
        background: #0866ff; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.4);
      }
      .theme-card .name { font-size: 13px; font-weight: 600; margin-top: 4px; }
      .theme-card .by { font-size: 11.5px; color: #65676b; font-weight: 400; }
      .theme-add .preview {
        outline: 1.5px dashed #bcc0c4; flex-direction: column; align-items: center; justify-content: center;
        gap: 4px; color: #65676b; font-size: 12.5px;
      }
      .theme-links { display: flex; flex-direction: column; justify-content: center; gap: 8px; font-size: 13px; padding-bottom: 20px; }
      .link-button { border: 0; background: transparent; padding: 0; font: inherit; color: #0866ff; cursor: pointer; text-align: left; }
      .notice { margin: 10px 12px 0; padding: 9px 12px; border-radius: 8px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
      .notice.error { background: #fdecea; border: 1px solid #f5c2bd; }
      .notice.ok { background: #e8f5ec; border: 1px solid #b7e0c3; }
      .notice span { flex: 1; }
      .look-cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; padding: 14px 12px 0; }
      .swatches { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 10px; }
      .swatch {
        width: 24px; height: 24px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); display: grid; place-items: center;
      }
      .swatch[aria-checked="true"] { box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #1c1e21; }
      .swatch.theme-accent { background: conic-gradient(from 225deg, #2b2d31 0 50%, #d9dadd 50% 100%); }
      .swatch.custom { background: conic-gradient(#e5484d, #f27a1a, #f5c400, #2ea44f, #0f9d9a, #0866ff, #8a3ffc, #e0427a, #e5484d); }
      .look-cols select { margin-top: 10px; max-width: 100%; }
      .icon-choices { display: flex; align-items: center; gap: 8px; padding: 2px 12px; }
      .icon-choices .seg { margin-left: 8px; }
      .icon-choice {
        display: flex; align-items: center; gap: 9px; padding: 6px 12px 6px 6px; border-radius: 10px;
        border: 1.5px solid #dadde1; background: transparent; font: inherit; font-size: 13px; color: inherit; cursor: pointer;
      }
      .icon-choice img { width: 30px; height: 30px; }
      .icon-choice[aria-checked="true"] { border-color: #0866ff; background: #e7f0ff; }
      .section-hint { color: #65676b; font-size: 12px; padding: 6px 12px 0; }
      #update-notes { margin: 4px 0; font-size: 12px; max-width: 420px; }
      #update-notes summary { cursor: pointer; }
      .update-notes-text { white-space: pre-wrap; max-height: 160px; overflow: auto; margin-top: 4px; }
      footer {
        padding: 12px 20px; border-top: 1px solid #e4e6eb;
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
      }
      button.action {
        background: #0866ff; color: #fff; border: 0; border-radius: 8px;
        padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer;
      }
      button.action:active { opacity: .85; }
      .ver { opacity: .55; font-size: 12px; }
      #status { opacity: .7; font-size: 12px; min-height: 16px; }
      @media (prefers-color-scheme: dark) {
        body { background: #242526; color: #e4e6eb; }
        .row:hover { background: #3a3b3c; }
        .tabs { background: #242526; }
        .tabs, footer { border-color: #3a3b3c; }
        .hint { color: #b0b3b8; }
        .nickname-options { background: #272829; border-color: #343536; }
        .tab { color: #b0b3b8; }
        .tab:hover { background: #3a3b3c; color: #e4e6eb; }
        .tab.active { background: #263a59; color: #5b9bff; }
        .section-title, .theme-card .by, .section-hint { color: #b0b3b8; }
        .seg { background: #3a3b3c; }
        .seg button { color: #b0b3b8; }
        .seg button[aria-checked="true"] { background: #5a5c60; color: #ffffff; box-shadow: none; }
        .theme-card .preview { outline-color: rgba(255,255,255,.12); }
        .theme-card[aria-checked="true"] .preview { outline-color: #5b9bff; }
        .theme-add .preview { outline-color: #5a5c60; color: #b0b3b8; }
        .link-button { color: #5b9bff; }
        .notice.error { background: #3a2422; border-color: #6b3530; }
        .notice.ok { background: #1e3326; border-color: #2f5a3d; }
        .swatch[aria-checked="true"] { box-shadow: 0 0 0 2px #242526, 0 0 0 4px #e4e6eb; }
        .icon-choice { border-color: #3a3b3c; }
        .icon-choice[aria-checked="true"] { border-color: #5b9bff; background: #263a59; }
      }
    </style>
  </head>
  <body>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Settings sections"></nav>
    <main id="rows" role="tabpanel"></main>
    <footer>
      <div>
        <div class="ver" id="version">Carrier</div>
        <div id="status"></div>
        <details id="update-notes" hidden>
          <summary></summary>
          <div class="update-notes-text"></div>
        </details>
        <a href="#" id="reset" style="font-size:12px;opacity:.7">Reset to defaults</a>
      </div>
      <button class="action" id="check" type="button" disabled>Check for updates</button>
    </footer>

    <script src="settings-update.js"></script>
    <script>
      const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);

      // Per-field metadata: [key, label, hint]. Grouping into tabs is below.
      const FIELDS = [
        ["always_on_top", "Always on Top", "Keep the window above other apps."],
        ["global_hotkey", "Global Hotkey", "Show or hide Carrier from anywhere (Cmd/Ctrl+Shift+M)."],
        ["show_tray", "Show System Tray", "Show a Carrier icon in the system tray."],
        ["start_to_tray", "Start to Tray", "Launch hidden, into the tray."],
        ["autostart", "Start on System Startup", "Launch Carrier when you log in."],
        ["hide_on_close", "Hide on Close", "Closing the window hides it instead of quitting."],
        ["unread_badge", "Unread Badge", "Show the unread count on the Dock / taskbar icon."],
        ["mute_notifications", "Mute Notifications", "Don't show desktop notifications for new messages."],
        ["notification_sound", "Notification sound", "Play the system sound when a notification arrives."],
        ["notify_group_chats", "Group Chat Notifications", "Notify for messages in group chats. The unread badge counts them either way."],
        ["hide_notification_preview", "Hide Message Preview", "Notify without the sender name or message text."],
        ["group_notifications_by_conversation", "Group by Conversation", "Stack notifications from the same conversation together."],
        ["clear_notifications_on_view", "Clear When Viewed", "Remove a conversation's notifications when you view it in Carrier."],
        ["attention_on_message", "Bounce Dock Icon", "Bounce the Dock icon when a message arrives while Carrier is unfocused."],
        ["hide_names", "Hide Names", "Blur contact names in the conversation list and open conversation. Cmd/Ctrl+Shift+H toggles names and avatars together."],
        ["hide_avatars", "Hide Avatars", "Blur profile pictures, group pictures and read-receipt faces."],
        ["system_emoji", "System Emoji", "Render emoji with your system's emoji font instead of Facebook's."],
        ["block_typing_indicator", "Block Typing Indicator", "Don't show others that you are typing. You still see when they type."],
        ["stop_media_autoplay", "Stop Media Autoplay", "Pause videos and GIFs that start automatically. Manual playback still works."],
        ["menu_bar_only", "Menu Bar Only", "Hide the Dock icon and live in the menu bar (needs the tray)."],
        ["hide_menu_bar", "Hide Top Menu", "Hide the Carrier / File / Edit / View / Window row. Settings remains available from the gear button or F3."],
        ["hide_on_minimize", "Hide When Minimized", "Move Carrier into the tray instead of leaving it minimized."],
        ["hide_on_focus_loss", "Hide When Focus Is Lost", "Move Carrier into the tray whenever another app gets focus."],
        ["hide_taskbar_icon", "Hide Taskbar Icon", "Keep Carrier out of the taskbar and reopen it from the tray."],
        ["automatic_update_checks", "Automatic Update Checks", "Check for signed Carrier updates on startup and on the schedule below. Carrier asks before installing or opening package-manager instructions."],
        ["hold_failures", "Hold Failures for Investigation", "Keep a broken Messenger view intact. Diagnostics continue, but automatic reloads and rebuilds pause. Manual reload still works."],
        ["focus_composer_on_return", "Focus Message Box", "When you open a conversation or switch back to Carrier with one open, put the cursor in the message box."],
        ["spellcheck", "Spell check", "Underline misspelled words while typing (applies on reload)."],
        ["block_telemetry", "Block Facebook telemetry", "Stop Facebook's analytics and logging requests. Doesn't affect messaging."],
        ["strip_link_tracking", "Remove Facebook link tracking", "Strip Facebook tracking IDs from links you copy or open in your browser."],
        ["send_with_accelerator", "Require Cmd/Ctrl+Enter to Send", "Plain Enter inserts a line break; use Cmd+Enter on macOS or Ctrl+Enter on Windows/Linux to send."],
        ["multi_instance", "Multi Instance", "Allow more than one window (experimental, needs restart)."],
      ];
      const FIELD_META = Object.fromEntries(FIELDS.map(([k, label, hint]) => [k, { label, hint }]));

      // Inline lucide-style icons (no dependency / build step).
      const ICONS = {
        general:
          '<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
        appearance:
          '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
        tray: '<path d="M12 2v10"/><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>',
        notifications:
          '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
        privacy:
          '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
        account:
          '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
        advanced:
          '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
      };

      const IS_MAC = /Mac/.test(navigator.platform || navigator.userAgent);
      const IS_WINDOWS = /Win/.test(navigator.platform || navigator.userAgent);
      const IS_LINUX = !IS_MAC && !IS_WINDOWS && /Linux/.test(navigator.userAgent);
      let runtimeCapabilities = null;

      // The shared attention setting is a Dock bounce on macOS and a taskbar
      // flash on Windows — same setting, per-OS wording (defined here because the
      // platform flags are not available yet where FIELDS is built above).
      if (IS_WINDOWS) {
        FIELD_META.attention_on_message = {
          label: "Flash Taskbar Icon",
          hint: "Flash the taskbar button when a message arrives while Carrier is unfocused.",
        };
      }

      const TABS = [
        { id: "general", label: "General", icon: ICONS.general,
          fields: ["always_on_top", "global_hotkey", "hide_on_close", "spellcheck", "focus_composer_on_return", "download_behavior"] },
        { id: "appearance", label: "Appearance", icon: ICONS.appearance,
          fields: ["theme_section", "app_icon", "display_heading", "zoom", ...(IS_MAC ? [] : ["hide_menu_bar"]), ...(IS_LINUX ? ["title_bar"] : []), "system_emoji", "stop_media_autoplay", "nickname_scope"] },
        { id: "tray", label: "Tray & Startup", icon: ICONS.tray,
          fields: [
            "show_tray", "start_to_tray", "autostart",
            ...(IS_MAC || IS_LINUX || IS_WINDOWS ? ["tray_icon_style"] : []),
            ...(IS_MAC ? ["menu_bar_only"] : []),
            ...(IS_WINDOWS ? ["hide_on_minimize", "hide_on_focus_loss", "hide_taskbar_icon"] : []),
          ] },
        { id: "notifications", label: "Notifications", icon: ICONS.notifications,
          fields: ["mute_notifications", "notification_sound", "notify_group_chats", "hide_notification_preview", "notification_reaction",
                   ...(IS_MAC ? ["group_notifications_by_conversation"] : []),
                   ...(IS_MAC || IS_WINDOWS ? ["clear_notifications_on_view", "attention_on_message"] : []),
                   "unread_badge", "muted_conversations", "badge_mode", "test_notification"] },
        { id: "privacy", label: "Privacy", icon: ICONS.privacy,
          fields: ["block_typing_indicator", "hide_names", "hide_avatars", "block_telemetry", "strip_link_tracking"] },
        { id: "account", label: "Account", icon: ICONS.account, fields: ["messenger_account"] },
        { id: "advanced", label: "Advanced", icon: ICONS.advanced,
          fields: ["automatic_update_checks", "update_check_hours", "hold_failures", "send_with_accelerator", "multi_instance", "custom_css", "open_logs"] },
      ];

      let activeTab = "general";
      try {
        const saved = localStorage.getItem("carrier:settingsTab");
        if (saved && TABS.some((t) => t.id === saved)) activeTab = saved;
      } catch (_) {}

      let settings = {};
      const setStatus = (m) => (document.getElementById("status").textContent = m || "");

      function svgIcon(inner) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("fill", "none");
        svg.setAttribute("stroke", "currentColor");
        svg.setAttribute("stroke-width", "1.6");
        svg.setAttribute("stroke-linecap", "round");
        svg.setAttribute("stroke-linejoin", "round");
        svg.setAttribute("aria-hidden", "true");
        svg.innerHTML = inner;
        return svg;
      }

      async function refresh() {
        try {
          settings = await invoke("get_settings");
          render();
        } catch (e) {
          console.error(e);
        }
      }

      let pendingSave = Promise.resolve();
      function persist(key, value) {
        pendingSave = pendingSave.then(() => saveSetting(key, value));
        return pendingSave;
      }

      async function saveSetting(key, value) {
        try {
          // Re-read first so we don't clobber a change made elsewhere (e.g.
          // View → Toggle Always on Top) with a stale snapshot.
          const fresh = await invoke("get_settings");
          fresh[key] = typeof value === "function" ? value(fresh) : value;
          settings = await invoke("set_settings", { new: fresh });
          render();
          setStatus("Saved.");
          setTimeout(() => setStatus(""), 1200);
        } catch (e) {
          // Surface the real reason (e.g. autostart registration failed) and
          // re-sync the checkboxes with what was actually persisted.
          setStatus(String(e && e.message ? e.message : e));
          console.error(e);
          await refresh();
        }
      }

      // Build a <select> row bound to a setting. `parse` converts the chosen
      // option value before persisting (e.g. Number for the numeric zoom);
      // string settings omit it.
      function selectRow(key, fallback, options, label, hint, disabled, parse) {
        const row = document.createElement("label");
        row.className = "row";
        const sel = document.createElement("select");
        for (const [val, txt] of options) {
          const o = document.createElement("option");
          o.value = val;
          o.textContent = txt;
          if (String(settings[key] || fallback) === val) o.selected = true;
          sel.appendChild(o);
        }
        sel.disabled = !!disabled;
        sel.onchange = () => persist(key, parse ? parse(sel.value) : sel.value);
        const text = document.createElement("div");
        text.innerHTML = `<div class="label">${label}</div><div class="hint">${hint}</div>`;
        row.append(sel, text);
        return row;
      }

      // ----- Appearance: theme gallery, accent color, font, app icon -----

      let themes = null; // [{ id, name, author, mode, preview, builtIn }]
      let fonts = null; // installed font families
      let themeNotice = null; // { kind: "error" | "ok", text }

      // Messenger's own colors for Default, and the dark previews of the
      // built-in themes (theme headers carry one preview).
      const DEFAULT_PREVIEW = {
        light: ["#f0f2f5", "#ffffff", "#ffffff", "#0866ff", "#f0f0f0"],
        dark: ["#1c1c1d", "#242526", "#242526", "#0866ff", "#303030"],
      };
      const DARK_PREVIEWS = {
        graphite: ["#141517", "#1d1e20", "#212224", "#d9dadd", "#2f3134"],
        warm: ["#16120f", "#1f1a16", "#241e19", "#d9774c", "#352c25"],
      };
      const ACCENTS = [
        ["#0866ff", "Blue"], ["#8a3ffc", "Purple"], ["#e0427a", "Pink"], ["#e5484d", "Red"],
        ["#f27a1a", "Orange"], ["#2ea44f", "Green"], ["#0f9d9a", "Teal"],
      ];

      async function loadThemes() {
        try {
          themes = await invoke("list_themes");
        } catch (e) {
          themes = [];
          console.error(e);
        }
      }

      function pageIsDark() {
        if (settings.theme === "dark") return true;
        if (settings.theme === "light") return false;
        return window.matchMedia("(prefers-color-scheme: dark)").matches;
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function segmented(label, options, current, onPick) {
        const seg = el("div", "seg");
        seg.setAttribute("role", "radiogroup");
        seg.setAttribute("aria-label", label);
        for (const [value, text] of options) {
          const b = el("button", "", text);
          b.type = "button";
          b.setAttribute("role", "radio");
          b.setAttribute("aria-checked", String(value === current));
          b.onclick = () => value !== current && onPick(value);
          seg.append(b);
        }
        return seg;
      }

      function sectionHead(title, control) {
        const head = el("div", "section-head");
        head.append(el("div", "section-title", title));
        if (control) head.append(control);
        return head;
      }

      function labelled(label, control) {
        const wrap = el("div", "section-control");
        wrap.append(el("span", "", label), control);
        return wrap;
      }

      function checkMark() {
        const check = el("span", "check");
        check.innerHTML = '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        return check;
      }

      function isDarkColor(hex) {
        const n = parseInt(hex.slice(1), 16);
        const luma = 0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255);
        return luma < 128;
      }

      // A drawn preview from five colors: window, list, chat, yours, theirs.
      function previewFor(colors) {
        const [wash, list, chat, out, incoming] = colors;
        const box = el("span", "preview");
        box.style.background = wash;
        const side = el("span", "list");
        side.style.background = list;
        const ink = isDarkColor(list) ? "#ffffff" : "#000000";
        for (let i = 0; i < 4; i += 1) {
          const line = el("i");
          line.style.background = ink;
          line.style.width = `${[80, 60, 70, 50][i]}%`;
          side.append(line);
        }
        const pane = el("span", "chat");
        pane.style.background = chat;
        for (const [kind, color] of [["in", incoming], ["out", out], ["in", incoming]]) {
          const bubble = el("span", `bubble ${kind}`);
          bubble.style.background = color;
          pane.append(bubble);
        }
        box.append(side, pane);
        return box;
      }

      function cardColors(theme, dark) {
        let colors;
        if (theme.id === "default") colors = DEFAULT_PREVIEW[dark ? "dark" : "light"];
        else if (dark && DARK_PREVIEWS[theme.id]) colors = DARK_PREVIEWS[theme.id];
        else colors = theme.preview || DEFAULT_PREVIEW[dark ? "dark" : "light"];
        colors = colors.slice();
        if (settings.accent_color) colors[3] = settings.accent_color;
        return colors;
      }

      function themeCard(theme, dark) {
        const card = el("button", "theme-card");
        card.type = "button";
        card.setAttribute("role", "radio");
        const selected = (settings.color_theme || "default") === theme.id;
        card.setAttribute("aria-checked", String(selected));
        const unavailable = theme.mode && theme.mode !== (dark ? "dark" : "light");
        if (unavailable) card.classList.add("unavailable");
        const preview = previewFor(cardColors(theme, dark));
        if (theme.mode) preview.append(el("span", "pill", theme.mode === "dark" ? "Dark only" : "Light only"));
        if (selected) preview.append(checkMark());
        const name = el("span", "name", theme.name);
        if (!theme.builtIn) {
          name.append(" ");
          const by = el("span", "by", theme.author ? `by ${theme.author}` : "Added by you");
          name.append(by);
        }
        card.append(preview, name);
        card.title = unavailable
          ? `${theme.name} applies only while Messenger is ${theme.mode}.`
          : theme.name;
        card.onclick = () => persist("color_theme", theme.id);
        return card;
      }

      async function addTheme() {
        try {
          const id = await invoke("add_theme");
          if (!id) return;
          await loadThemes();
          const added = themes.find((t) => t.id === id);
          themeNotice = { kind: "ok", text: `Added ${added ? added.name : "the theme"}. Edit its file in the themes folder and reload (Cmd/Ctrl+R) to see changes.` };
          await persist("color_theme", id);
        } catch (e) {
          themeNotice = { kind: "error", text: String(e && e.message ? e.message : e) };
          render();
        }

      async function removeTheme(theme) {
        try {
          await invoke("remove_theme", { id: theme.id });
          await loadThemes();
          themeNotice = { kind: "ok", text: `Removed ${theme.name}.` };
          if ((settings.color_theme || "default") === theme.id) await persist("color_theme", "default");
          else render();

          themeNotice = { kind: "error", text: String(e && e.message ? e.message : e) };

      function checkboxRow(key) {
        const meta = FIELD_META[key];
        const row = document.createElement("label");

        // Hide Names / Hide Avatars fall back to the older combined switch.
        cb.checked =
          key === "hide_names" || key === "hide_avatars"
            ? (settings[key] ?? settings.hide_names_avatars) === true
            : !!settings[key];
        const trayRequired =
          IS_WINDOWS &&
          (settings.hide_on_minimize || settings.hide_on_focus_loss || settings.hide_taskbar_icon);
        const runtimeUnavailable =
          (key === "multi_instance" &&
            (!runtimeCapabilities || !runtimeCapabilities.multiInstance)) ||
          (key === "autostart" &&
            (!runtimeCapabilities || !runtimeCapabilities.autostart)) ||
          (key === "automatic_update_checks" &&
            (!runtimeCapabilities || !runtimeCapabilities.automaticUpdateChecks));
        if ((key === "show_tray" && trayRequired) || runtimeUnavailable) {
          cb.disabled = true;
        }
        cb.onchange = () => persist(key, cb.checked);
        const text = document.createElement("div");
        let hint = meta.hint;
        const pausedUntil = settings.notifications_paused_until;
        if (key === "mute_notifications" && typeof pausedUntil === "number" && pausedUntil > Date.now()) {
          const end = new Date(pausedUntil);
          const time = end.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
          const day = end.toDateString() === new Date().toDateString() ? "" : `${end.toLocaleDateString([], { weekday: "short" })} `;
          hint = `Paused until ${day}${time} from the tray or Dock menu, which can also resume them.`;
        } else if (key === "show_tray" && trayRequired) {
          hint = `${hint} Required by an enabled Windows tray behavior.`;
        } else if (runtimeUnavailable) {
          if (!runtimeCapabilities) {
            hint = "Unavailable because Carrier could not verify this runtime capability.";
          } else if (key === "automatic_update_checks" && runtimeCapabilities.debug) {
            hint = "Debug drafts are managed by carrier-debug-update. Release updates are blocked.";
          } else if (key === "multi_instance") {
            hint = "The Snap package supports one Carrier process at a time.";
          } else if (runtimeCapabilities.snap) {
            hint =
              key === "autostart"
                ? "Start on System Startup is not yet supported in the Snap package."
                : "Managed by Snap and your software center.";
          } else {
            hint = "Unavailable in this installation environment.";
          }

        text.innerHTML = `<div class="label">${meta.label}</div><div class="hint">${hint}</div>`;
        row.append(cb, text);
        return row;

      // Switch to a tab (no-op re-render if already active) and, when asked,
      // move focus to its button — used by keyboard nav so focus follows the
      // selection across the re-render that rebuilds the buttons.
      function selectTab(id, focus) {
        if (id !== activeTab) {
          activeTab = id;
          try {
            localStorage.setItem("carrier:settingsTab", id);
          } catch (_) {}
          render();
        }
        if (focus) {
          const el = document.getElementById("tab-" + id);
          if (el) el.focus();
        }
      }

      // ARIA tablist keyboard support: Left/Right move between tabs (wrapping),
      // Home/End jump to the first/last. Activation follows focus (automatic
      // activation — switching panels is cheap). Other keys fall through.
      function onTabKeydown(e, id) {
        const i = TABS.findIndex((t) => t.id === id);
        if (i < 0) return;
        let j = null;
        if (e.key === "ArrowRight") j = (i + 1) % TABS.length;
        else if (e.key === "ArrowLeft") j = (i - 1 + TABS.length) % TABS.length;
        else if (e.key === "Home") j = 0;
        else if (e.key === "End") j = TABS.length - 1;
        if (j === null) return;
        e.preventDefault();
        selectTab(TABS[j].id, true);
      }

      function renderTabs() {
        const nav = document.getElementById("tabs");
        nav.innerHTML = "";
        for (const t of TABS) {
          const active = t.id === activeTab;
          const b = document.createElement("button");
          b.type = "button";
          b.className = "tab" + (active ? " active" : "");
          b.id = "tab-" + t.id;
          b.setAttribute("role", "tab");
          b.setAttribute("aria-selected", String(active));
          b.setAttribute("aria-controls", "rows");
          // Roving tabindex: only the active tab is in the Tab order; the arrow
          // keys move focus among the rest.
          b.tabIndex = active ? 0 : -1;
          b.appendChild(svgIcon(t.icon));
          const lbl = document.createElement("span");
          lbl.className = "lbl";
          lbl.textContent = t.label;
          b.appendChild(lbl);
          b.onclick = () => selectTab(t.id, false);
          b.onkeydown = (e) => onTabKeydown(e, t.id);
          nav.appendChild(b);
        }
        // The single shared panel is labelled by whichever tab is selected.
        document.getElementById("rows").setAttribute("aria-labelledby", "tab-" + activeTab);
      }

      // ----- Account: Messenger's own account settings (Ref #358) -----
      // Read and changed through the Messenger page, which reports the state
      // Messenger has afterwards.
      const messengerAccount = { state: null, error: "", loading: false };

      async function loadMessengerAccount(change) {
        if (messengerAccount.loading) return;
        messengerAccount.loading = true;
        messengerAccount.error = "";
        if (activeTab === "account") renderBody();
        try {
          messengerAccount.state = change
            ? await invoke("set_messenger_account", { change })
            : await invoke("messenger_account");
        } catch (e) {
          messengerAccount.error = String(e && e.message ? e.message : e);
        } finally {
          messengerAccount.loading = false;
          if (activeTab === "account") renderBody();
        }
      }

      function accountToggleRow(setting, label, hint, value) {
        const row = el("label", "row");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = value === true;
        cb.disabled = value === null || messengerAccount.loading;
        cb.onchange = () => loadMessengerAccount({ setting, value: cb.checked });
        const text = el("div");
        text.append(
          el("div", "label", label),
          el("div", "hint", value === null ? "Messenger didn't report this setting." : hint),
        );
        row.append(cb, text);
        return row;
      }

      function dndRow(until) {
        const row = el("label", "row");
        const sel = document.createElement("select");
        const options = [
          ["0", "Off"],
          ["60", "For 1 hour"],
          ["480", "For 8 hours"],
          ["1440", "For 24 hours"],
          ["-1", "Until I turn it off"],
        ];
        let current = until === -1 ? "-1" : "0";
        let hint = "Turn off Messenger's notifications for a while, on all your devices. Carrier stays quiet too.";
        if (until === null) {
          hint = "Messenger didn't report Do Not Disturb.";
        } else if (until === -1) {
          hint = "On until you turn it off.";
        } else if (until * 1000 > Date.now()) {
          const end = new Date(until * 1000);
          const time = end.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
          const day = end.toDateString() === new Date().toDateString() ? "" : `${end.toLocaleDateString([], { weekday: "short" })} `;
          current = "on";
          options.unshift(["on", `On until ${day}${time}`]);
          hint = "On until the time shown.";
        }
        for (const [value, text] of options) {
          const option = el("option", "", text);
          option.value = value;
          option.selected = value === current;
          option.hidden = value === "on";
          sel.append(option);
        }
        sel.disabled = until === null || messengerAccount.loading;
        sel.onchange = () => {
          if (sel.value !== "on") loadMessengerAccount({ setting: "doNotDisturb", value: Number(sel.value) });
        };
        const text = el("div");
        text.append(el("div", "label", "Do Not Disturb"), el("div", "hint", hint));
        row.append(sel, text);
        return row;
      }

      function messengerAccountSection() {
        const wrap = el("div");
        wrap.append(
          sectionHead("Messenger account"),
          el(
            "div",
            "section-hint",
            "Your Facebook account's own Messenger settings. Changes apply wherever you use Messenger, including your phone. Carrier's own notification settings are on the Notifications tab.",
          ),
        );
        const { state, error, loading } = messengerAccount;
        if (error) {
          const notice = el("div", "notice error");
          notice.setAttribute("role", "alert");
          notice.append(el("span", "", error));
          const retry = el("button", "link-button", "Try Again");
          retry.type = "button";
          retry.onclick = () => loadMessengerAccount();
          notice.append(retry);
          wrap.append(notice);
        }
        if (!state) {
          if (loading) wrap.append(el("div", "section-hint", "Reading Messenger's settings…"));
          else if (!error) queueMicrotask(() => loadMessengerAccount());
          return wrap;
        }
        wrap.append(
          accountToggleRow(
            "activeStatus",
            "Active Status",
            "Show people when you're active or recently active.",
            state.activeStatus,
          ),
          accountToggleRow(
            "sounds",
            "Message Sounds",
            "Messenger's own sounds for new messages. Carrier's notification sound is separate.",
            state.sounds,
          ),
          dndRow(state.dndUntil),
        );
        return wrap;
      }

      // Pseudo-fields are <select> rows;
      // everything else is a checkbox.
      const CUSTOM_ROWS = {
        theme_section: themeSection,
        app_icon: appIconSection,
        display_heading: displayHeading,
        zoom: zoomRow,
        title_bar: titleBarRow,
        badge_mode: badgeModeRow,
        muted_conversations: mutedConversationsRow,
        notification_reaction: notificationReactionRow,
        update_check_hours: updateCheckHoursRow,
        download_behavior: downloadBehaviorRow,
        tray_icon_style: trayIconStyleRow,
        custom_css: customCssRow,
        open_logs: openLogsRow,
        test_notification: testNotificationRow,
        nickname_scope: nicknameRows,
        messenger_account: messengerAccountSection,
      };

      function renderBody() {
        const root = document.getElementById("rows");
        root.innerHTML = "";
        const tab = TABS.find((t) => t.id === activeTab) || TABS[0];
        for (const key of tab.fields) {
          const build = CUSTOM_ROWS[key];
          root.appendChild(build ? build() : checkboxRow(key));
        }
      }

      function render() {
        renderTabs();
        renderBody();
      }

      document.getElementById("reset").onclick = async (e) => {
        e.preventDefault();
        try {
          settings = await invoke("reset_settings");
          render();
          setStatus("Reset to defaults.");
          setTimeout(() => setStatus(""), 1200);
        } catch (err) {
          setStatus(String(err && err.message ? err.message : err));
          console.error(err);
          await refresh();
        }
      };

      // Pick up changes made elsewhere (e.g. the View menu) when refocused.
      window.addEventListener("focus", refresh);
      // And Messenger account changes made on another device.
      window.addEventListener("focus", () => {
        if (activeTab === "account" && messengerAccount.state) loadMessengerAccount();
      });
      // A newer discovery may have replaced or cleared the offered update.
      window.addEventListener("focus", () => {
        updateController.refresh().catch(() => {});
      });

      const updateButton = document.getElementById("check");
      // The pending update's own release notes, as plain text, while one is offered.
      const notesBox = document.getElementById("update-notes");
      let notesVersion = "";
      async function showReleaseNotes(state) {
        if (state.phase !== "available" || !state.version) {
          notesBox.hidden = true;
          notesVersion = "";
          return;
        }
        if (notesVersion === state.version) return;
        notesVersion = state.version;
        let notes = null;
        try {
          // Native returns notes only while it still offers this version.
          notes = await invoke("update_release_notes", { version: state.version });
        } catch (_) {}
        if (notesVersion !== state.version) return;
        if (typeof notes !== "string" || !notes) {
          notesBox.hidden = true;
          return;
        }
        notesBox.querySelector("summary").textContent = `What's new in Carrier ${state.version}`;
        notesBox.querySelector(".update-notes-text").textContent = notes;
        notesBox.hidden = false;
      }
      const updateController = new CarrierSettingsUpdate.UpdateConsentController(
        (command) => invoke(command),
        (state) => {
          updateButton.textContent = state.buttonLabel;
          updateButton.disabled = state.busy;
          setStatus(state.status);
          showReleaseNotes(state);
        },
      );
      updateButton.onclick = async () => {
        try {
          await updateController.activate();
        } catch (e) {
          updateController.fail(e);
          console.error(e);
        }
      };

      (async () => {
        try {
          runtimeCapabilities = await invoke("runtime_capabilities");
        } catch (e) {
          console.error(e);
        }
        try {
          settings = await invoke("get_settings");
        } catch (e) {
          console.error(e);
        }
        render();
        try {
          await updateController.initialize();
        } catch (e) {
          updateController.fail(e);
          console.error(e);
        }
        try {
          const v = await invoke("plugin:app|version");
          document.getElementById("version").textContent = "Carrier " + v;
        } catch (_) {}
      })();
    </script>
  </body>
</html>
