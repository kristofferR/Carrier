<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrier</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        background: #f0f2f5;
        color: #1c1e21;
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      main {
        width: min(480px, 100%);
        text-align: center;
      }
      .mark {
        width: 44px;
        height: 44px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: #0866ff;
        color: #fff;
      }
      .mark svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.2;
        font-weight: 650;
      }
      p {
        margin: 0 auto;
        max-width: 420px;
        color: #65676b;
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 22px;
      }
      button {
        min-width: 96px;
        min-height: 38px;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        background: #0866ff;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: .58;
      }
      #open-anyway {
        background: transparent;
        color: #0866ff;
        box-shadow: inset 0 0 0 1px #0866ff;
      }
      #detail {
        display: none;
        max-width: 100%;
        margin: 18px auto 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, .05);
        color: #65676b;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        text-align: left;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      body[data-state="checking"] .mark,
      body[data-state="loading"] .mark {
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: .52; }
        50% { opacity: 1; }
      }
      @media (prefers-color-scheme: dark) {
        body { background: #18191a; color: #e4e6eb; }
        p, #detail { color: #b0b3b8; }
        #detail { background: rgba(255, 255, 255, .08); }
        #open-anyway { color: #4599ff; box-shadow: inset 0 0 0 1px #4599ff; }
      }
      /* Carrier's window controls on Windows and Linux (src-tauri/src/title_bar.rs):
         this page shows before Messenger has loaded, in a window with no frame. */
      #title-strip { position: fixed; top: 0; left: 0; right: 0; height: var(--inset); }
      #window-controls { position: fixed; top: 0; right: 0; height: var(--inset); display: flex; align-items: center; color: inherit; }
      #window-controls button { appearance: none; border: 0; border-radius: 0; margin: 0; padding: 0; min-width: 0; min-height: 0; box-shadow: none; font: inherit; display: grid; place-items: center; color: inherit; background: transparent; cursor: default; }
      #window-controls svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
      html[data-controls="windows"] #window-controls button { width: 46px; height: 100%; }
      html[data-controls="windows"] #window-controls button:hover { background: rgba(127, 127, 127, .18); }
      html[data-controls="windows"] #window-controls button[data-action="close"]:hover { background: #c42b1c; color: #fff; }
      html[data-controls="linux"] #window-controls { gap: 10px; padding: 0 8px; }
      html[data-controls="linux"] #window-controls button { width: 24px; height: 24px; border-radius: 50%; background: rgba(127, 127, 127, .18); }
      html[data-controls="linux"] #window-controls svg { width: 9px; height: 9px; stroke-width: 1.4; }
    </style>
  </head>
  <body data-state="checking">
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" />
        </svg>
      </div>
      <div role="status" aria-live="polite" aria-atomic="true">
        <h1 id="title">Checking Messenger</h1>
        <p id="message">Carrier is checking whether Facebook Messenger is reachable.</p>
      </div>
      <div class="actions">
        <button id="retry" type="button" disabled>Retry</button>
        <button id="open-anyway" type="button" hidden>Open anyway</button>
      </div>
      <pre id="detail" aria-live="polite"></pre>
    </main>

    <script>
      const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const detail = document.getElementById("detail");
      const retry = document.getElementById("retry");
      const openAnyway = document.getElementById("open-anyway");

      function render(status) {
        document.body.dataset.state = status.state || "error";
        title.textContent = status.title || "Cannot load Messenger";
        message.textContent = status.message || "Carrier could not reach Messenger.";
        if (status.detail) {
          detail.textContent = status.detail;
          detail.style.display = "block";
        } else {
          detail.textContent = "";
          detail.style.display = "none";
        }
        retry.disabled = status.state === "checking";
        openAnyway.hidden = !["blocked", "unreachable", "error"].includes(status.state);
        openAnyway.disabled = false;
      }

      async function connect(retryStartupTransients) {
        render({
          state: "checking",
          title: "Checking Messenger",
          message: "Carrier is checking whether Facebook Messenger is reachable.",
        });
        try {
          render(await invoke("connect_messenger", { retryStartupTransients }));
        } catch (error) {
          render({
            state: "error",
            title: "Cannot check Messenger",
            message: "Carrier could not run its reachability check.",
            detail: String(error && error.message ? error.message : error),
          });
        }
      }

      retry.addEventListener("click", () => connect(false));
      openAnyway.addEventListener("click", async () => {
        retry.disabled = true;
        openAnyway.disabled = true;
        render({
          state: "loading",
          title: "Opening Messenger",
          message: "Carrier is asking the webview to connect without the system DNS check.",
        });
        try {
          render(await invoke("open_messenger_anyway"));
        } catch (error) {
          render({
            state: "error",
            title: "Cannot open Messenger",
            message: "Carrier could not ask the webview to open Messenger.",
            detail: String(error && error.message ? error.message : error),
          });
        }
      });
      connect(true);
    </script>
    <script>
      // Carrier's window controls on Windows and Linux, until Messenger loads
      // (src-tauri/src/title_bar.rs keeps them in step with the window).
      (() => {
        const control = (action) => window.__TAURI_INTERNALS__.invoke("window_control", { action }).catch(() => {});
        const root = document.documentElement;
        const paths = {
          minimize: '<path d="M2 6h8" />',
          maximize: '<rect x="2" y="2" width="8" height="8" rx="1" />',
          restore: '<rect x="2" y="4" width="6" height="6" rx="1" /><path d="M4.5 4V3a1 1 0 0 1 1-1H9a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H8" />',
          close: '<path d="M2.5 2.5l7 7M9.5 2.5l-7 7" />',
        };
        const icon = (name) => `<svg viewBox="0 0 12 12" aria-hidden="true">${paths[name]}</svg>`;
        let strip = null;
        let box = null;
        const build = () => {
          strip = document.createElement("div");
          strip.id = "title-strip";
          strip.addEventListener("mousedown", (event) => {
            if (event.button !== 0) return;
            event.preventDefault();
            control(event.detail === 2 ? "toggle-maximize" : "drag");
          });
          box = document.createElement("div");
          box.id = "window-controls";
          for (const [action, label] of [["minimize", "Minimize"], ["toggle-maximize", "Maximize"], ["close", "Close"]]) {
            const button = document.createElement("button");
            button.type = "button";
            button.dataset.action = action;
            button.addEventListener("click", () => control(action));
            box.append(button);
          }
        };
        const apply = (state) => {
          const shown = Boolean(state && state.controls && state.inset > 0);
          if (!shown) {
            strip?.remove();
            box?.remove();
            delete root.dataset.controls;
            return;
          }
          if (!box) build();
          root.dataset.controls = state.controls;
          root.style.setProperty("--inset", `${state.inset}px`);
          for (const button of box.children) {
            const action = button.dataset.action;
            const name = action === "toggle-maximize" ? (state.maximized ? "restore" : "maximize") : action;
            const label = { minimize: "Minimize", maximize: "Maximize", restore: "Restore", close: "Close" }[name];
            if (button.dataset.icon !== name) {
              button.dataset.icon = name;
              button.innerHTML = icon(name);
              button.title = label;
              button.setAttribute("aria-label", label);
            }
          }
          if (!box.isConnected) document.body.append(strip, box);
        };
        window.__carrierTitleBar = apply;
        apply(window.__CARRIER_TITLE_BAR__);
      })();
    </script>
  </body>
</html>
